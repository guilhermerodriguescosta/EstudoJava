spring.config.import=optional:file:.env[.properties]
spring.application.name=endpoint
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/estudojava}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=app
spring.rabbitmq.password=app
